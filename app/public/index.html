<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Item Catalog</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; }
    table { border-collapse: collapse; width: 100%; margin-top: 1rem; }
    th, td { border: 1px solid #ccc; padding: 0.5rem; text-align: left; }
    form { display: flex; gap: 0.5rem; margin-top: 1rem; }
    input { flex: 1; padding: 0.4rem; }
    .state { margin-top: 1rem; color: #666; }
    .error { color: #b00020; }
  </style>
</head>
<body>
  <h1>Item Catalog</h1>
  <p id="user-role" class="state" data-testid="user-role"></p>

  <form id="create-form">
    <input id="name-input" data-testid="name-input" placeholder="Item name" autocomplete="off" />
    <button type="submit" data-testid="add-button">Add</button>
  </form>

  <p id="loading" class="state" data-testid="loading">Loading…</p>
  <p id="empty" class="state" data-testid="empty-state" hidden>No items yet</p>
  <p id="error" class="state error" data-testid="error-state" hidden>Failed to load items</p>

  <table id="items-table" data-testid="items-table" hidden>
    <thead>
      <tr><th>Name</th><th>Created</th><th></th></tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>

  <script>
    const el = (id) => document.getElementById(id);
    let role = 'viewer'; // fail closed until the profile loads

    async function loadProfile() {
      try {
        const res = await fetch('/api/me');
        if (!res.ok) throw new Error('bad status ' + res.status);
        const me = await res.json();
        role = me.role;
        el('user-role').textContent = me.user + ' (' + me.role + ')';
      } catch {
        el('user-role').textContent = 'guest (viewer)';
      }
    }

    async function loadItems() {
      el('loading').hidden = false;
      el('error').hidden = true;
      el('empty').hidden = true;
      el('items-table').hidden = true;
      try {
        const res = await fetch('/api/items');
        if (!res.ok) throw new Error('bad status ' + res.status);
        const { data } = await res.json();
        el('loading').hidden = true;
        const rows = el('rows');
        rows.innerHTML = '';
        if (data.length === 0) {
          el('empty').hidden = false;
          return;
        }
        for (const item of data) {
          const tr = document.createElement('tr');
          tr.dataset.testid = 'item-row';
          const deleteCell = role === 'admin'
            ? '<td><button data-testid="delete-button" data-id="' + item.id + '">Delete</button></td>'
            : '<td></td>';
          tr.innerHTML =
            '<td>' + item.name + '</td>' +
            '<td>' + new Date(item.created_at).toLocaleDateString() + '</td>' +
            deleteCell;
          rows.appendChild(tr);
        }
        el('items-table').hidden = false;
      } catch {
        el('loading').hidden = true;
        el('error').hidden = false;
      }
    }

    el('create-form').addEventListener('submit', async (event) => {
      event.preventDefault();
      const name = el('name-input').value.trim();
      if (!name) return;
      await fetch('/api/items', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ name }),
      });
      el('name-input').value = '';
      await loadItems();
    });

    el('rows').addEventListener('click', async (event) => {
      const button = event.target.closest('[data-testid="delete-button"]');
      if (!button) return;
      await fetch('/api/items/' + button.dataset.id, { method: 'DELETE' });
      await loadItems();
    });

    (async () => {
      await loadProfile(); // role must be known before rows render
      await loadItems();
    })();
  </script>
</body>
</html>
